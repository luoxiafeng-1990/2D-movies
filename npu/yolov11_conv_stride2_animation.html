<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>YOLOv11 卷积 stride=2 降维动画 + 真实架构图解</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#e0e0e0;font-family:'Segoe UI',sans-serif}
.container{max-width:1400px;margin:0 auto;padding:10px}
h1{text-align:center;color:#7ecfff;font-size:22px;margin-bottom:4px}
.subtitle{text-align:center;color:#888;font-size:12px;margin-bottom:10px}
.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.tabs button{background:#1a2a3c;color:#7ecfff;border:1px solid #2a4a6c;padding:7px 16px;border-radius:6px;cursor:pointer;font-size:13px}
.tabs button.active{background:#2a5a8c;border-color:#4a8acc}
.panel{display:none}
.panel.active{display:block}
.ctrl-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.ctrl-row label{font-size:12px;color:#aaa}
.ctrl-row select,.ctrl-row input{background:#1a2a3c;color:#7ecfff;border:1px solid #2a4a6c;padding:3px 8px;border-radius:4px;font-size:12px;width:65px}
.ctrl-row button{background:#2a5a8c;color:#fff;border:none;padding:5px 14px;border-radius:4px;cursor:pointer;font-size:12px}
.ctrl-row button:hover{background:#3a7acc}
canvas{display:block;margin:0 auto;border-radius:8px;border:1px solid #1a2a3a}
.explain{background:#111827;border:1px solid #1f2937;border-radius:8px;padding:10px 14px;margin-top:8px;font-size:12px;line-height:1.7}
.explain h3{color:#7ecfff;margin-bottom:4px;font-size:14px}
.hl{color:#ffa94d;font-weight:bold}
.hl2{color:#51cf66;font-weight:bold}
.hl3{color:#ff6b6b;font-weight:bold}
.source-link{text-align:center;margin:6px 0;font-size:11px}
.source-link a{color:#4a9eff}
#archCanvas{cursor:default}
.arch-nav{display:flex;justify-content:center;gap:8px;margin:8px 0}
.arch-nav button{background:#1a2a3c;color:#aaa;border:1px solid #2a4a6c;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:12px}
.arch-nav button.active{background:#2a5a8c;color:#7ecfff;border-color:#4a8acc}
</style>
</head>
<body>
<div class="container">
<h1>YOLOv11 卷积降维原理 + 真实网络架构图解</h1>
<p class="subtitle">Tab 1：stride=2 卷积动画 | Tab 2：YOLO11 官方架构逐层图解（每个张量/卷积核都画出来）</p>

<div class="tabs">
  <button class="active" onclick="showTab(0)">动画：stride=2 卷积缩小图片</button>
  <button onclick="showTab(1)">YOLO11 逐层图解（官方数据）</button>
</div>

<!-- ===== Tab 1 ===== -->
<div class="panel active" id="panel0">
<div class="ctrl-row">
  <label>输入尺寸:</label>
  <select id="inputSize"><option value="8">8×8</option><option value="10">10×10</option><option value="12" selected>12×12</option><option value="16">16×16</option></select>
  <label>stride:</label>
  <select id="strideSize"><option value="1">1(不缩小)</option><option value="2" selected>2(缩小一半)</option></select>
  <label>速度:</label>
  <select id="speed"><option value="600">慢</option><option value="300" selected>中</option><option value="100">快</option></select>
  <button onclick="startAnim()">▶ 开始</button>
  <button onclick="resetAnim()">↺ 重置</button>
</div>
<canvas id="convCanvas" width="1280" height="500"></canvas>
<div class="explain" id="convExplain">
  <h3>操作说明</h3>
  <p><span class="hl">蓝色粗框</span> = 3×3 卷积核的当前位置 | <span class="hl2">绿色高亮</span> = 被覆盖的像素 | <span class="hl3">红色高亮</span> = 输出结果位置</p>
  <p>stride=2 时卷积核每次跳 <b>2 格</b>，输出 = (N−3+2)/2+1 = <b>N/2</b>，正好缩小一半</p>
</div>
</div>

<!-- ===== Tab 2 ===== -->
<div class="panel" id="panel1">
<div class="source-link">
  数据来源：<a href="https://github.com/ultralytics/ultralytics/blob/main/ultralytics/cfg/models/11/yolo11.yaml" target="_blank">ultralytics GitHub 官方 yolo11.yaml</a>（YOLO11n: depth=0.50, width=0.25）
</div>
<div class="arch-nav">
  <button class="active" onclick="showLayer(0)">层0: Conv 640→320</button>
  <button onclick="showLayer(1)">层1: Conv 320→160</button>
  <button onclick="showLayer(2)">层2: C3k2 @160</button>
  <button onclick="showLayer(3)">层3: Conv 160→80</button>
  <button onclick="showLayer(4)">层4-6: @80, @40</button>
  <button onclick="showLayer(5)">层7-10: SPPF+C2PSA</button>
  <button onclick="showLayer(6)">Neck+Head 总览</button>
</div>
<canvas id="archCanvas" width="1380" height="680"></canvas>
<div class="explain" id="archExplain"></div>
</div>
</div>

<script>
function showTab(idx){
  document.querySelectorAll('.panel').forEach((p,i)=>p.classList.toggle('active',i===idx));
  document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',i===idx));
  if(idx===1) showLayer(currentLayer);
}

// ==================== TAB 1: Stride Conv Animation ====================
const cc=document.getElementById('convCanvas'), cx=cc.getContext('2d');
let animTimer=null, inputGrid=[], kernel=[], outputGrid=[];
let curRow=0,curCol=0,N=12,K=3,S=2,pad=1,outN=0,isRunning=false;

function initGrids(){
  N=parseInt(document.getElementById('inputSize').value);
  S=parseInt(document.getElementById('strideSize').value);
  K=3; pad=1;
  outN=Math.floor((N-K+2*pad)/S)+1;
  inputGrid=[]; for(let r=0;r<N;r++){inputGrid[r]=[];for(let c=0;c<N;c++) inputGrid[r][c]=Math.floor(Math.random()*200+30);}
  kernel=[]; for(let r=0;r<K;r++){kernel[r]=[];for(let c=0;c<K;c++) kernel[r][c]=parseFloat((Math.random()*2-1).toFixed(2));}
  outputGrid=[]; for(let r=0;r<outN;r++){outputGrid[r]=[];for(let c=0;c<outN;c++) outputGrid[r][c]=null;}
  curRow=0;curCol=0;
}

function getPixel(r,c){const rr=r-pad,cc2=c-pad;if(rr<0||rr>=N||cc2<0||cc2>=N)return 0;return inputGrid[rr][cc2];}

function drawGrids(){
  cx.clearRect(0,0,cc.width,cc.height);
  const cellMax=Math.min(Math.floor(380/N),42);
  const cell=Math.max(18,cellMax);
  const startX=20, startY=55;
  const inTop=curRow*S-pad, inLeft=curCol*S-pad;

  cx.fillStyle='#7ecfff'; cx.font='bold 14px Segoe UI'; cx.textAlign='left';
  cx.fillText(`输入: ${N}×${N}  (像素值)`,startX,20);
  cx.fillStyle='#666'; cx.font='11px Segoe UI';
  cx.fillText(`padding=${pad} (边缘补0)`,startX,36);

  for(let r=0;r<N;r++){
    for(let c=0;c<N;c++){
      const x=startX+c*cell, y=startY+r*cell;
      const isK=isRunning && r>=inTop && r<inTop+K && c>=inLeft && c<inLeft+K;
      const v=inputGrid[r][c];
      if(isK){cx.fillStyle='rgba(81,207,102,0.6)';}
      else{const g=Math.floor(v*0.7+40);cx.fillStyle=`rgb(${g+30},${g+20},${g})`;}
      cx.fillRect(x,y,cell-1,cell-1);
      // visible border
      cx.strokeStyle='#334455'; cx.lineWidth=1; cx.strokeRect(x,y,cell-1,cell-1);
      if(cell>=22){cx.fillStyle=isK?'#fff':'#ccc';cx.font=`${Math.min(11,cell-8)}px Segoe UI`;cx.textAlign='center';cx.fillText(v,x+cell/2,y+cell/2+4);}
    }
  }
  if(isRunning){cx.strokeStyle='#4a9eff';cx.lineWidth=3;cx.strokeRect(startX+(curCol*S-pad)*cell-2,startY+(curRow*S-pad)*cell-2,K*cell+3,K*cell+3);}

  // Kernel
  const kernelX=startX+N*cell+35;
  cx.fillStyle='#ffa94d';cx.font='bold 14px Segoe UI';cx.textAlign='left';
  cx.fillText(`卷积核: ${K}×${K}`,kernelX,20);
  cx.fillStyle='#666';cx.font='11px Segoe UI';cx.fillText('(训练学到的权重)',kernelX,36);
  const kcell=Math.max(38,Math.min(50,cell));
  for(let r=0;r<K;r++){for(let c=0;c<K;c++){
    const x=kernelX+c*kcell,y=startY+r*kcell,v=kernel[r][c];
    cx.fillStyle=v>=0?`rgba(74,158,255,${Math.abs(v)*0.4+0.2})`:`rgba(255,107,107,${Math.abs(v)*0.4+0.2})`;
    cx.fillRect(x,y,kcell-1,kcell-1);
    cx.strokeStyle='#445566';cx.lineWidth=1;cx.strokeRect(x,y,kcell-1,kcell-1);
    cx.fillStyle='#fff';cx.font='bold 12px Segoe UI';cx.textAlign='center';cx.fillText(v.toFixed(2),x+kcell/2,y+kcell/2+4);
  }}
  if(isRunning){
    let total=0;
    for(let kr=0;kr<K;kr++)for(let kc=0;kc<K;kc++) total+=getPixel(curRow*S-pad+kr+pad,curCol*S-pad+kc+pad)*kernel[kr][kc];
    const silu=total*(1/(1+Math.exp(-total)));
    cx.fillStyle='#ffa94d';cx.font='12px Segoe UI';cx.textAlign='left';
    cx.fillText(`Σ(像素×权重) = ${total.toFixed(1)}`,kernelX,startY+K*kcell+20);
    cx.fillStyle='#51cf66';cx.fillText(`SiLU → ${silu.toFixed(1)}`,kernelX,startY+K*kcell+38);
  }

  // Output
  const outX=kernelX+K*kcell+80;
  cx.fillStyle='#ff6b9d';cx.font='bold 14px Segoe UI';cx.textAlign='left';
  cx.fillText(`输出: ${outN}×${outN}  ${S===2?'(缩小一半！)':'(不变)'}`,outX,20);
  cx.fillStyle='#666';cx.font='11px Segoe UI';
  cx.fillText(`= (${N}−3+2)/${S}+1 = ${outN}`,outX,36);
  const ocell=Math.max(22,Math.min(55,cell*N/outN*0.7));
  for(let r=0;r<outN;r++){for(let c=0;c<outN;c++){
    const x=outX+c*ocell,y=startY+r*ocell,v=outputGrid[r][c];
    const isCur=isRunning&&r===curRow&&c===curCol;
    if(v!==null){const nv=Math.max(30,Math.min(230,Math.abs(v)%200+40));cx.fillStyle=isCur?'#ff4444':`rgb(${nv},${Math.floor(nv*0.6)},${Math.floor(nv*0.4)})`;
    }else{cx.fillStyle='#151525';}
    cx.fillRect(x,y,ocell-1,ocell-1);
    cx.strokeStyle=isCur?'#ff4444':'#334455';cx.lineWidth=isCur?2:1;cx.strokeRect(x,y,ocell-1,ocell-1);
    if(v!==null&&ocell>=28){cx.fillStyle='#fff';cx.font=`${Math.min(10,ocell-10)}px Segoe UI`;cx.textAlign='center';cx.fillText(Math.round(v),x+ocell/2,y+ocell/2+3);}
  }}

  const by=startY+Math.max(N*cell,outN*ocell)+15;
  cx.fillStyle='#7ecfff';cx.font='bold 13px Segoe UI';cx.textAlign='left';
  cx.fillText(`stride=${S}：卷积核每次移动 ${S} 格 → 输出 ${outN}×${outN}`,20,by);
  if(isRunning){cx.fillStyle='#ffa94d';cx.font='12px Segoe UI';cx.textAlign='right';
    cx.fillText(`位置[${curRow},${curCol}] | 进度 ${((curRow*outN+curCol+1)/(outN*outN)*100).toFixed(0)}%`,cc.width-20,by);}
}

function stepAnim(){
  let total=0;
  for(let kr=0;kr<K;kr++)for(let kc=0;kc<K;kc++) total+=getPixel(curRow*S-pad+kr+pad,curCol*S-pad+kc+pad)*kernel[kr][kc];
  outputGrid[curRow][curCol]=total*(1/(1+Math.exp(-total)));
  drawGrids();
  curCol++;if(curCol>=outN){curCol=0;curRow++;}
  if(curRow>=outN){isRunning=false;clearInterval(animTimer);
    document.getElementById('convExplain').innerHTML=`<h3>✅ 完成！${N}×${N} → ${outN}×${outN}</h3><p>stride=${S} 使输出${S===2?'缩小一半':'不变'}。YOLO11 连做5次：640→320→160→80→40→20</p><p>每次还有 <span class="hl2">多个卷积核并行</span>（16/32/64/128/256个），每个产生一个特征图通道</p>`;}
}

function startAnim(){if(animTimer)clearInterval(animTimer);initGrids();isRunning=true;drawGrids();animTimer=setInterval(stepAnim,parseInt(document.getElementById('speed').value));}
function resetAnim(){if(animTimer)clearInterval(animTimer);isRunning=false;initGrids();drawGrids();}
initGrids();drawGrids();

// ==================== TAB 2: Architecture Diagrams ====================
const ac=document.getElementById('archCanvas'), ax=ac.getContext('2d');
let currentLayer=0;

function showLayer(idx){
  currentLayer=idx;
  document.querySelectorAll('.arch-nav button').forEach((b,i)=>b.classList.toggle('active',i===idx));
  drawLayer(idx);
}

function drawTensor3D(x,y,w,h,d,color,label,sizeLabel){
  const off=Math.min(d*3,40);
  // back face
  ax.fillStyle=color+'44';
  ax.beginPath();ax.moveTo(x+off,y-off);ax.lineTo(x+w+off,y-off);ax.lineTo(x+w+off,y+h-off);ax.lineTo(x+off,y+h-off);ax.closePath();ax.fill();
  ax.strokeStyle=color+'88';ax.lineWidth=1;ax.stroke();
  // top face
  ax.fillStyle=color+'33';
  ax.beginPath();ax.moveTo(x,y);ax.lineTo(x+off,y-off);ax.lineTo(x+w+off,y-off);ax.lineTo(x+w,y);ax.closePath();ax.fill();
  ax.strokeStyle=color+'88';ax.stroke();
  // right face
  ax.fillStyle=color+'55';
  ax.beginPath();ax.moveTo(x+w,y);ax.lineTo(x+w+off,y-off);ax.lineTo(x+w+off,y+h-off);ax.lineTo(x+w,y+h);ax.closePath();ax.fill();
  ax.strokeStyle=color+'88';ax.stroke();
  // front face
  ax.fillStyle=color+'66';
  ax.fillRect(x,y,w,h);
  ax.strokeStyle=color;ax.lineWidth=1.5;ax.strokeRect(x,y,w,h);
  // labels
  if(label){ax.fillStyle='#fff';ax.font='bold 12px Segoe UI';ax.textAlign='center';ax.fillText(label,x+w/2,y+h/2+4);}
  if(sizeLabel){ax.fillStyle='#bbb';ax.font='11px Segoe UI';ax.textAlign='center';ax.fillText(sizeLabel,x+w/2,y+h+15);}
}

function drawKernelGrid(x,y,size,values,color){
  const c=size;
  for(let r=0;r<3;r++){for(let co=0;co<3;co++){
    const v=values?values[r*3+co]:(Math.random()*2-1);
    ax.fillStyle=v>=0?`rgba(74,158,255,${Math.abs(v)*0.4+0.2})`:`rgba(255,107,107,${Math.abs(v)*0.4+0.2})`;
    ax.fillRect(x+co*c,y+r*c,c-1,c-1);
    ax.strokeStyle='#445566';ax.lineWidth=0.5;ax.strokeRect(x+co*c,y+r*c,c-1,c-1);
  }}
}

function drawArrowH(x1,y1,x2,y2,color,label){
  ax.beginPath();ax.moveTo(x1,y1);ax.lineTo(x2,y2);ax.strokeStyle=color||'#3a5a7a';ax.lineWidth=2;ax.stroke();
  const a=Math.atan2(y2-y1,x2-x1),s=8;
  ax.beginPath();ax.moveTo(x2,y2);ax.lineTo(x2-s*Math.cos(a-0.4),y2-s*Math.sin(a-0.4));ax.lineTo(x2-s*Math.cos(a+0.4),y2-s*Math.sin(a+0.4));ax.closePath();ax.fillStyle=color||'#3a5a7a';ax.fill();
  if(label){ax.fillStyle='#aaa';ax.font='11px Segoe UI';ax.textAlign='center';ax.fillText(label,(x1+x2)/2,(y1+y2)/2-8);}
}

function drawLayer(idx){
  ax.clearRect(0,0,ac.width,ac.height);
  const el=document.getElementById('archExplain');

  if(idx===0){ // Layer 0: Conv 640→320
    ax.fillStyle='#7ecfff';ax.font='bold 16px Segoe UI';ax.textAlign='left';
    ax.fillText('层0：Conv [64, 3, 2] — 640×640×3 → 320×320×16',15,25);
    ax.fillStyle='#888';ax.font='12px Segoe UI';
    ax.fillText('3×3卷积，stride=2，padding=1 | 16个卷积核（YOLO11n: 64×0.25=16）',15,42);

    // Input: 3 channel planes
    ax.fillStyle='#fff';ax.font='bold 13px Segoe UI';ax.textAlign='center';
    ax.fillText('输入图片',90,62);
    const colors=['#ff4444','#44cc44','#4488ff'];
    const labels=['R','G','B'];
    for(let i=2;i>=0;i--){
      drawTensor3D(20+i*18, 80+i*12, 140, 140, 1, colors[i], labels[i]+' 通道', i===0?'640×640×3':'');
    }

    // Arrow
    drawArrowH(230,170,290,170,'#ffa94d','Conv 3×3, s=2');

    // 16 kernels
    ax.fillStyle='#ffa94d';ax.font='bold 13px Segoe UI';ax.textAlign='center';
    ax.fillText('16 个卷积核（每个 3×3×3）',470,62);
    ax.fillStyle='#888';ax.font='11px Segoe UI';
    ax.fillText('每个卷积核有 3层(RGB) × 3×3 = 27个权重',470,78);

    for(let k=0;k<16;k++){
      const col=k%8, row=Math.floor(k/8);
      const kx=300+col*44, ky=92+row*80;
      // 3 stacked small kernels for 3 channels
      for(let ch=2;ch>=0;ch--){
        const ox=kx+ch*4, oy=ky-ch*4;
        drawKernelGrid(ox,oy,12,null,colors[ch]);
      }
      ax.fillStyle='#aaa';ax.font='10px Segoe UI';ax.textAlign='center';
      ax.fillText(`#${k}`,kx+18,ky+42);
    }

    // Arrow
    drawArrowH(660,170,720,170,'#ffa94d','stride=2');

    // Output: 16 channel feature maps
    ax.fillStyle='#ff6b9d';ax.font='bold 13px Segoe UI';ax.textAlign='center';
    ax.fillText('输出：16个特征图',920,62);

    for(let i=15;i>=0;i--){
      const hue=(i/16*200+180)%360;
      const ox=740+i*8, oy=80+i*5;
      ax.fillStyle=`hsla(${hue},60%,50%,0.3)`;
      ax.fillRect(ox,oy,120,120);
      ax.strokeStyle=`hsla(${hue},60%,50%,0.7)`;ax.lineWidth=1;ax.strokeRect(ox,oy,120,120);
    }
    ax.fillStyle='#bbb';ax.font='11px Segoe UI';ax.textAlign='center';
    ax.fillText('320×320×16',860,280);
    ax.fillStyle='#ff6b9d';ax.font='11px Segoe UI';
    ax.fillText('每个特征图 = 一个卷积核扫描全图的结果',860,298);

    // Bottom: CBS internal
    const by=320;
    ax.fillStyle='#7ecfff';ax.font='bold 14px Segoe UI';ax.textAlign='left';
    ax.fillText('这个 Conv 内部其实是 CBS (Conv + BatchNorm + SiLU)，共 3 层操作：',15,by);

    // Draw CBS pipeline
    const stages=[
      {label:'Conv 卷积',sub:'3×3, stride=2\n16个卷积核\n27个权重/核',color:'#4a9eff',w:160},
      {label:'BatchNorm',sub:'批归一化\n标准化输出\n防止数值爆炸',color:'#51cf66',w:150},
      {label:'SiLU 激活',sub:'x × sigmoid(x)\n非线性判定\n=一个神经元的决策',color:'#ffa94d',w:160},
    ];
    let sx=80;
    for(let i=0;i<stages.length;i++){
      const s=stages[i];
      ax.fillStyle=s.color+'22';
      ax.fillRect(sx,by+20,s.w,100);
      ax.strokeStyle=s.color;ax.lineWidth=2;ax.strokeRect(sx,by+20,s.w,100);
      ax.fillStyle='#fff';ax.font='bold 13px Segoe UI';ax.textAlign='center';
      ax.fillText(s.label,sx+s.w/2,by+42);
      ax.fillStyle='#bbb';ax.font='11px Segoe UI';
      const lines=s.sub.split('\n');
      lines.forEach((l,j)=>ax.fillText(l,sx+s.w/2,by+58+j*15));
      if(i<2) drawArrowH(sx+s.w+5,by+70,sx+s.w+35,by+70,s.color);
      sx+=s.w+40;
    }

    ax.fillStyle='#ff6b6b';ax.font='bold 13px Segoe UI';ax.textAlign='left';
    ax.fillText('→ 所以每个 "Conv" 块实际上包含 3 层操作，不是 1 层！',sx+20,by+70);

    // Formula
    ax.fillStyle='#888';ax.font='12px Segoe UI';ax.textAlign='left';
    ax.fillText('参数量 = 16个卷积核 × (3通道 × 3×3权重 + 1偏置) = 16 × 28 = 448 个权重',15,by+145);

    el.innerHTML='<h3>层0 详解</h3><p>输入 RGB 图片有 <span class="hl3">3 个通道</span>（红、绿、蓝），每个通道是一张 640×640 的灰度图。</p><p><span class="hl">16 个卷积核</span>同时工作，每个卷积核大小 3×3×3（看3个通道的3×3区域），stride=2 所以输出缩小一半。</p><p>每个卷积核产生一个 320×320 的特征图，16个卷积核 → 输出 320×320×<span class="hl2">16</span>。</p>';
  }
  else if(idx===1){ // Layer 1
    ax.fillStyle='#7ecfff';ax.font='bold 16px Segoe UI';ax.textAlign='left';
    ax.fillText('层1：Conv [128, 3, 2] — 320×320×16 → 160×160×32',15,25);
    ax.fillStyle='#888';ax.font='12px Segoe UI';
    ax.fillText('3×3卷积，stride=2 | 32个卷积核（YOLO11n: 128×0.25=32），每个卷积核 3×3×16',15,42);

    // Input
    ax.fillStyle='#fff';ax.font='bold 12px Segoe UI';ax.textAlign='center';

    ax.fillText('C2PSA 内部约 8 层操作：先算"哪里重要"的注意力权重图，再用权重图放大重要区域、弱化不重要区域',30,ly+105);
    ax.fillStyle='#ffa94d';ax.font='bold 12px Segoe UI';
    ax.fillText('这就是为什么 YOLOv11 比 YOLOv8 更准确：注意力让网络"看重点"而不是平均看',30,ly+130);

    el.innerHTML='<h3>层7-10: 网络最深处</h3><p>SPPF 提供多尺度感知，C2PSA 提供注意力聚焦。这两个组件让 20×20 的最深层特征包含了最丰富的高级语义信息。</p>';
  }
  else if(idx===6){ // Full overview
    ax.fillStyle='#7ecfff';ax.font='bold 16px Segoe UI';ax.textAlign='left';

      {name:'Backbone',color:'#4a9eff',y:45,h:200,items:[

        {label:'Conv s=2',size:'320→160×32',x:140},
        {label:'C3k2',size:'160×160×64',x:260},
        {label:'Conv s=2',size:'160→80×64',x:380},
        {label:'C3k2',size:'80×80×128',x:500},
        {label:'Conv s=2',size:'80→40×128',x:620},
        {label:'C3k2',size:'40×40×128',x:740},
        {label:'Conv s=2',size:'40→20×256',x:860},
        {label:'C3k2',size:'20×20×256',x:980},
        {label:'SPPF',size:'20×20×256',x:1100},
        {label:'C2PSA',size:'20×20×256',x:1220},
      ]},
      {name:'Neck (FPN上采样 + PAN下采样)',color:'#20c997',y:260,h:140,items:[
        {label:'Upsample',size:'20→40',x:20},
        {label:'Concat+C3k2',size:'40×40×128',x:150},
        {label:'Upsample',size:'40→80',x:340},
        {label:'Concat+C3k2',size:'80×80×64',x:470},
        {label:'Conv s=2↓',size:'80→40',x:660},
        {label:'Concat+C3k2',size:'40×40×128',x:790},
        {label:'Conv s=2↓',size:'40→20',x:980},
        {label:'Concat+C3k2',size:'20×20×256',x:1110},
      ]},
      {name:'Head (Detect)',color:'#cc5de8',y:415,h:120,items:[
        {label:'P3/8 小目标',size:'80×80×64',x:120},
        {label:'P4/16 中目标',size:'40×40×128',x:500},
        {label:'P5/32 大目标',size:'20×20×256',x:880},
      ]},
    ];

    sections.forEach(sec=>{
      ax.fillStyle=sec.color+'0a';ax.fillRect(10,sec.y,1360,sec.h);
      ax.strokeStyle=sec.color+'44';ax.lineWidth=1;ax.strokeRect(10,sec.y,1360,sec.h);
      ax.fillStyle=sec.color;ax.font='bold 13px Segoe UI';ax.textAlign='left';
      ax.fillText(sec.name,15,sec.y+16);

      sec.items.forEach((item,i)=>{
        const iw=item.label.length>12?120:100;
        const iy=sec.y+30;
        const tc=item.label.includes('C3k2')?'#ff6b6b':item.label.includes('SPPF')?'#51cf66':item.label.includes('C2PSA')?'#ffa94d':item.label.includes('Concat')?'#fab005':item.label.includes('Upsample')?'#20c997':item.label.includes('P3')||item.label.includes('P4')||item.label.includes('P5')?'#cc5de8':'#4a9eff';
        ax.fillStyle=tc+'33';ax.fillRect(item.x,iy,iw,sec.name==='Head'?70:sec.h-50);

    drawArrowH(690,245,690,260,'#aaa','');

    // CPU post-processing
